stages:
  - notify

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"

cat_food_reminder:
  stage: notify
  image: python:3.10-slim
  cache:
    key: pip-$CI_JOB_IMAGE
    paths:
      - .cache/pip
  before_script:
    - pip install -q -r requirements.txt
  script:
    - python script.py
  rules:
    # Uruchamiaj tylko z harmonogramu (CI/CD > Schedules) lub ręcznie z UI ("Run pipeline").
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  timeout: 10m
